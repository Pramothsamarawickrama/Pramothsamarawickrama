<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Loading — Pramoth Samarawickrama</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    cursor: none;
  }

  @media (hover: none) and (pointer: coarse) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none !important; }
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: #e8c97e;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease;
    mix-blend-mode: difference;
  }

  .cursor-ring {
    position: fixed;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(232,201,126,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 998;
    transform: translate(-50%, -50%);
    transition: left 0.18s ease, top 0.18s ease;
  }

  .loader-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .monogram {
    width: 150px;
    height: 150px;
    position: relative;
    margin-bottom: 32px;
  }

  .monogram svg {
    width: 100%;
    height: 100%;
    animation: rotateSlow 20s linear infinite;
  }

  @keyframes rotateSlow {
    to { transform: rotate(360deg); }
  }

  .monogram-inner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 45px;
    font-weight: 320;
    color: #e8c97e;
    letter-spacing: 0.05em;
    animation: pulseGlow 3s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.85; text-shadow: 0 0 20px rgba(232,201,126,0.3); }
    50% { opacity: 1; text-shadow: 0 0 40px rgba(232,201,126,0.6); }
  }

  .name-block {
    text-align: center;
    overflow: hidden;
  }

  .name-first {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(28px, 5vw, 40px);
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.25em;
    display: block;
    transform: translateY(40px);
    opacity: 0;
    animation: slideUp 1s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
  }

  .name-last {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 52px);
    color: #fff;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: block;
    transform: translateY(40px);
    opacity: 0;
    animation: slideUp 1s cubic-bezier(0.22,1,0.36,1) 0.55s forwards;
  }

  @keyframes slideUp {
    to { transform: translateY(0); opacity: 1; }
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e8c97e, transparent);
    margin: 20px auto;
    transform: scaleX(0);
    opacity: 0;
    animation: expandLine 0.8s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;
  }

  @keyframes expandLine {
    to { transform: scaleX(1); opacity: 1; }
  }

  .tagline {
    font-family: 'Syne', sans-serif;
    font-weight: 400;
    font-size: clamp(9px, 1.5vw, 11px);
    color: rgba(232,201,126,0.65);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease 1.1s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .progress-area {
    margin-top: 52px;
    width: min(320px, 70vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: fadeIn 0.8s ease 1.4s forwards;
  }

  .progress-track {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    background: linear-gradient(90deg, #7c5cbf, #e8c97e);
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 12px rgba(232,201,126,0.5);
  }

  .progress-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }

  .enter-btn {
    margin-top: 40px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #e8c97e;
    background: none;
    border: 1px solid rgba(232,201,126,0.4);
    padding: 14px 36px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(16px);
    transition: background 0.3s, border-color 0.3s, transform 0.2s;
    pointer-events: none;
  }

  .enter-btn:hover {
    background: rgba(232,201,126,0.08);
    border-color: rgba(232,201,126,0.8);
    transform: translateY(0) scale(1.02);
  }

  .enter-btn.visible {
    animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
    pointer-events: auto;
  }

  .corner-deco {
    position: fixed;
    width: 60px;
    height: 60px;
    z-index: 5;
    opacity: 0;
    animation: fadeIn 1s ease 1.8s forwards;
  }
  .corner-deco.tl { top: 32px; left: 32px; border-top: 1px solid rgba(232,201,126,0.35); border-left: 1px solid rgba(232,201,126,0.35); }
  .corner-deco.tr { top: 32px; right: 32px; border-top: 1px solid rgba(232,201,126,0.35); border-right: 1px solid rgba(232,201,126,0.35); }
  .corner-deco.bl { bottom: 32px; left: 32px; border-bottom: 1px solid rgba(232,201,126,0.35); border-left: 1px solid rgba(232,201,126,0.35); }
  .corner-deco.br { bottom: 32px; right: 32px; border-bottom: 1px solid rgba(232,201,126,0.35); border-right: 1px solid rgba(232,201,126,0.35); }

  .page-transition {
    position: fixed; inset: 0; z-index: 9999;
    background: #0a0a0f;
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease;
  }
  .page-transition.active { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<div class="page-transition" id="pageTransition"></div>
<canvas id="bg"></canvas>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<div class="loader-wrap">
  <div class="monogram">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="rgba(232,201,126,0.2)" stroke-width="0.5"/>
      <circle cx="50" cy="50" r="38" stroke="rgba(232,201,126,0.12)" stroke-width="0.5" stroke-dasharray="4 6"/>
      <circle cx="50" cy="50" r="46" stroke="url(#arcGrad)" stroke-width="1.2"
              stroke-dasharray="72 218" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="38" stroke="url(#arcGrad2)" stroke-width="0.8"
              stroke-dasharray="40 200" stroke-linecap="round"
              style="animation: rotateSlow 12s linear infinite reverse;"/>
      <defs>
        <linearGradient id="arcGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#7c5cbf"/>
          <stop offset="100%" stop-color="#e8c97e"/>
        </linearGradient>
        <linearGradient id="arcGrad2" x1="100" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#e8c97e"/>
          <stop offset="100%" stop-color="#7c5cbf"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="monogram-inner">PS</div>
  </div>

  <div class="name-block">
    <span class="name-first">Pramoth</span>
    <span class="name-last">Samarawickrama</span>
  </div>

  <div class="divider"></div>
  <span class="tagline">Crafting digital experiences</span>

  <div class="progress-area">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">Initializing&hellip;</span>
  </div>

  <button class="enter-btn" id="enterBtn">
    Enter Portfolio
  </button>
</div>

<script>
  // Particle canvas
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.size = Math.random() * 1.5 + 0.3;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3;
      this.life = Math.random();
      this.maxLife = Math.random() * 0.008 + 0.003;
      this.growing = true;
      this.opacity = 0;
      this.color = Math.random() < 0.3 ? '#e8c97e' : '#7c5cbf';
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.growing) {
        this.opacity += this.maxLife;
        if (this.opacity >= 0.6) this.growing = false;
      } else {
        this.opacity -= this.maxLife * 0.5;
        if (this.opacity <= 0) this.reset();
      }
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 6;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  for (let i = 0; i < 120; i++) particles.push(new Particle());

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    const spacing = 80;
    for (let x = 0; x < W; x += spacing) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += spacing) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function animate() {
    ctx.fillStyle = 'rgba(10,10,15,0.3)';
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    particles.forEach(p => { p.update(); p.draw(); });

    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.5);
    grad.addColorStop(0, 'rgba(124,92,191,0.04)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(animate);
  }
  animate();

  // Custom cursor — desktop only
  const cur = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (!isTouch) {
    document.addEventListener('mousemove', e => {
      cur.style.left = e.clientX + 'px';
      cur.style.top = e.clientY + 'px';
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
    });
  }

  // Enter button — fade out then navigate
  document.getElementById('enterBtn').addEventListener('click', function() {
    this.textContent = 'Welcome →';
    this.style.color = '#fff';
    setTimeout(() => {
      document.getElementById('pageTransition').classList.add('active');
      setTimeout(() => { window.location.href = 'pramoth-home.html'; }, 750);
    }, 300);
  });

  // Progress loader
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const btn = document.getElementById('enterBtn');
  const phases = ['Initializing…', 'Loading assets…', 'Rendering world…', 'Almost there…', 'Ready'];
  let progress = 0;
  let phase = 0;

  const interval = setInterval(() => {
    const inc = Math.random() * 4 + 1;
    progress = Math.min(progress + inc, 100);
    fill.style.width = progress + '%';

    const p = Math.floor(progress / 25);
    if (p < phases.length - 1 && p !== phase) {
      phase = p;
      label.textContent = phases[phase];
    }

    if (progress >= 100) {
      clearInterval(interval);
      label.textContent = 'Ready';
      setTimeout(() => {
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(16px)';
        btn.classList.add('visible');
      }, 400);
    }
  }, 80);
</script>
</body>
</html>
